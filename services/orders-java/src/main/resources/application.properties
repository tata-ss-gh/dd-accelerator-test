spring.application.name=orders
server.port=8002
# In-memory H2 database, created from schema.sql on startup
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
# Show error reasons in responses (demo project)
server.error.include-message=always
management.endpoints.web.exposure.include=health
# JSON log file for the Datadog Agent (Logstash JSON layout). The file path comes from
# -Dlogging.file.name=... on the command line. dd-java-agent puts dd.trace_id / dd.span_id
# into the MDC, so they appear on every line.
logging.structured.format.file=logstash
# Register Tomcat's MBeans (off by default in Spring Boot) so the Datadog Tomcat integration,
# run by JMXFetch inside dd-java-agent (DD_JMXFETCH_TOMCAT_ENABLED=true), can read
# thread pool, request and error counters.
server.tomcat.mbeanregistry.enabled=true
